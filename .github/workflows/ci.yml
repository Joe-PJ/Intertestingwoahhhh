name: Check and publish

# Every push (to any branch) and every pull request runs typecheck, lint,
# tests and build. A push to main that passes them also publishes the built
# app to GitHub Pages — once Pages is turned on for the repository
# (Settings → Pages → Source: GitHub Actions). Until then the publish job
# skips itself with a notice instead of failing.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push to a branch or pull request cancels that ref's older run;
  # pushes to main never cancel each other, so every main commit keeps its own
  # check result.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: Typecheck, lint, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Keep the built site for publishing
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publish:
    name: Publish to GitHub Pages
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Check that GitHub Pages is turned on
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if gh api "repos/$REPO/pages" --silent; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::GitHub Pages is not turned on yet, so nothing was published. Turn it on in Settings → Pages → Source: GitHub Actions."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish
        id: deployment
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
